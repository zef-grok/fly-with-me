name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate mist plumage + library import
        run: node tools/validate-library-node.mjs
      - name: Galaxy CPU checks
        run: node tests/galaxy-checks.mjs
      - name: Ambient bed wiring (GROK-13)
        run: node tools/validate-ambient-bed.mjs
      - name: Mistvale/willow scenery slice (GROK-16)
        run: node tools/validate-mistvale-slice.mjs
      - name: Larch foliage slice (GROK-17)
        run: node tools/validate-larch-slice.mjs
